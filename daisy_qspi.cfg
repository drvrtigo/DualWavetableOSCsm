# OpenOCD config to program the Daisy Seed's external QSPI flash (IS25LP064A,
# 8 MB @ 0x90000000) over SWD/JTAG with an ST-Link.
#
# Adapted from the community config by forum user "Pencioner" on the Daisy forum:
#   https://forum.electro-smith.com/t/is-there-an-external-loader-for-flashing-the-qspi-flash/9071
#   (attachment: /uploads/short-url/7MgvjP0lZbjnu8GxMoL31N3eZBf.txt)
#
# Key points that make this work where a naive stmqspi setup fails:
#   * transport select swd  (NOT hla_swd) — non-HLA access so the stmqspi flash
#     driver can drive the QUADSPI without wedging.
#   * PF6/PF7 (QSPI IO3/IO2 = the flash HOLD#/WP#) are driven SOLID HIGH as GPIO
#     so 1-line erases/programs aren't aborted by the chip.
#   * Exit-QPI (0xF5) + Reset (0x66/0x99) to leave the bootloader's mode, plus a
#     Global Block Unlock (0x98) so erase/program aren't blocked by protection.
#   * Pin map matches libDaisy: CLK=PF10, NCS=PG6, IO0=PF8, IO1=PF9, IO2=PF7,
#     IO3=PF6.
#
# Usage: openocd -f interface/stlink.cfg -f ./daisy_qspi.cfg \
#                -c "program build/triptech.elf verify reset exit"

adapter speed 1800
transport select dapdirect_swd
reset_config none

set QUADSPI 1
source [find target/stm32h7x.cfg]

proc daisy_qspi_unlock {} {
    global _CHIPNAME
    puts "> QSPI > Hardware wakeup & memory-mapped handover"

    # 1. Enable GPIO clocks (GPIOF, GPIOG) + a HOLD#/WP# pulse.
    set RCC_AHB4ENR 0x580244E0
    mww $RCC_AHB4ENR [expr {[mrw $RCC_AHB4ENR] | (1 << 5) | (1 << 6)}]

    set GPIOF_BASE 0x58021400
    set GPIOG_BASE 0x58021800

    mww [expr {$GPIOG_BASE + 0x14}] [expr {[mrw [expr {$GPIOG_BASE + 0x14}]] | 0x00000040}]
    mww [expr {$GPIOG_BASE + 0x00}] [expr {([mrw [expr {$GPIOG_BASE + 0x00}]] & 0xFFFFCFFF) | 0x00001000}]

    mww [expr {$GPIOF_BASE + 0x14}] [expr {[mrw [expr {$GPIOF_BASE + 0x14}]] | 0x000000C0}]
    mww [expr {$GPIOF_BASE + 0x00}] [expr {([mrw [expr {$GPIOF_BASE + 0x00}]] & 0xFFFF0FFF) | 0x00005000}]
    sleep 20
    mww [expr {$GPIOF_BASE + 0x14}] [expr {[mrw [expr {$GPIOF_BASE + 0x14}]] & 0xFFFFFF3F}]
    sleep 20
    mww [expr {$GPIOF_BASE + 0x14}] [expr {[mrw [expr {$GPIOF_BASE + 0x14}]] | 0x000000C0}]
    sleep 20

    # 2. Mux PF6..PF10 / PG6 to the QUADSPI alternate function.
    mww [expr {$GPIOF_BASE + 0x0C}] [expr {([mrw [expr {$GPIOF_BASE + 0x0C}]] & 0xFFC00FFF) | 0x00155000}]
    mww [expr {$GPIOG_BASE + 0x0C}] [expr {([mrw [expr {$GPIOG_BASE + 0x0C}]] & 0xFFFFCFFF) | 0x00001000}]

    mww [expr {$GPIOF_BASE + 0x08}] [expr {[mrw [expr {$GPIOF_BASE + 0x08}]] | 0x003FF000}]
    mww [expr {$GPIOG_BASE + 0x08}] [expr {[mrw [expr {$GPIOG_BASE + 0x08}]] | 0x00003000}]

    mww [expr {$GPIOF_BASE + 0x20}] [expr {([mrw [expr {$GPIOF_BASE + 0x20}]] & 0x00FFFFFF) | 0x99000000}]
    mww [expr {$GPIOF_BASE + 0x24}] [expr {([mrw [expr {$GPIOF_BASE + 0x24}]] & 0xFFFFF000) | 0x000009AA}]
    mww [expr {$GPIOG_BASE + 0x20}] [expr {([mrw [expr {$GPIOG_BASE + 0x20}]] & 0xF0FFFFFF) | 0x0A000000}]

    mww [expr {$GPIOF_BASE + 0x00}] [expr {([mrw [expr {$GPIOF_BASE + 0x00}]] & 0xFFC00FFF) | 0x002AA000}]
    mww [expr {$GPIOG_BASE + 0x00}] [expr {([mrw [expr {$GPIOG_BASE + 0x00}]] & 0xFFFFCFFF) | 0x00002000}]

    # 3. Reset + enable QUADSPI, bring the flash to a known state.
    set RCC_AHB3RSTR 0x58024484
    set RCC_AHB3ENR  0x580244D4
    mww $RCC_AHB3RSTR [expr {[mrw $RCC_AHB3RSTR] | 0x00004000}]
    mww $RCC_AHB3RSTR [expr {[mrw $RCC_AHB3RSTR] & 0xFFFFBFFF}]
    mww $RCC_AHB3ENR  [expr {[mrw $RCC_AHB3ENR] | 0x00004000}]

    set QUADSPI_CR  0x52005000
    set QUADSPI_DCR 0x52005004
    set QUADSPI_FCR 0x5200500C
    set QUADSPI_CCR 0x52005014

    mww $QUADSPI_CR 0x03000001
    mww $QUADSPI_DCR 0x00160100
    sleep 5

    # Exit QPI, Reset Enable, Reset
    mww $QUADSPI_CCR 0x000003F5
    sleep 5
    mww $QUADSPI_CCR 0x00000166
    sleep 5
    mww $QUADSPI_CCR 0x00000199
    sleep 10

    # Write Enable + Global Block Unlock (clears block protection)
    mww $QUADSPI_FCR 0x1B
    mww $QUADSPI_CCR 0x00000106
    sleep 5
    mww $QUADSPI_FCR 0x1B
    mww $QUADSPI_CCR 0x00000198
    sleep 10

    # 4. Pin PF6/PF7 (HOLD#/WP#) HIGH as plain outputs so 1-line erases aren't
    #    aborted by the flash.
    puts "> QSPI > Locking HOLD#/WP# high"
    mww [expr {$GPIOF_BASE + 0x00}] [expr {([mrw [expr {$GPIOF_BASE + 0x00}]] & 0xFFC00FFF) | 0x002A5000}]
    sleep 5

    # 5. Memory-mapped mode (1-line normal read 0x03) for verification.
    puts "> QSPI > Memory-mapped at 0x90000000"
    mww $QUADSPI_CR 0x03000003 ;# ABORT
    mww $QUADSPI_CCR 0x0D002503
}

# Run the unlock as part of OpenOCD's reset-init (after stm32h7x.cfg's own).
global _CHIPNAME
set old_reset_init [$_CHIPNAME.cpu0 cget -event reset-init]
$_CHIPNAME.cpu0 configure -event reset-init "$old_reset_init; daisy_qspi_unlock"
